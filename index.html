<script type="importmap">

<style>
  :root {
    --bg: #f4f2ee; --panel: #ffffff; --ink: #1f2328; --muted: #6b7280; --line: #e3e0da;
    --accent: #c2410c; --accent-soft: #fff1e8; --steel: #4b5563;
    --warn: #b45309; --warn-bg: #fff7e6; --err: #b91c1c; --err-bg: #fdecec; --info: #1d4ed8; --info-bg: #eef3ff;
  }
  * { box-sizing: border-box; }
  html, body { margin: 0; background: var(--bg); color: var(--ink);
    font-family: "Hiragino Sans", "Noto Sans JP", "Yu Gothic UI", system-ui, sans-serif; font-size: 14px; }
  header { display: flex; align-items: baseline; gap: 12px; padding: 14px 20px; border-bottom: 1px solid var(--line); background: var(--panel); }

  .f label { font-size: 13px; }
  .f .hint { grid-column: 1 / -1; color: var(--muted); font-size: 11px; margin-top: -2px; line-height: 1.5; }
  .f input[type=number], .f select { width: 100%; padding: 5px 6px; border: 1px solid var(--line); border-radius: 6px; font: inherit; background: #fff; text-align: right; }
  .f select { text-align: left; }
  .f .unit { position: relative; }

  .f.check { grid-template-columns: 1fr auto; }
  .f input[type=checkbox] { width: 18px; height: 18px; accent-color: var(--accent); }

  summary { cursor: pointer; font-weight: 700; font-size: 12px; color: var(--steel); }

  .vtools button, .btn { border: 1px solid var(--line); background: rgba(255,255,255,.92); border-radius: 999px; padding: 5px 12px; font: inherit; font-size: 12px; cursor: pointer; color: var(--ink); }

  .legend3d i { display: inline-block; width: 10px; height: 10px; border-radius: 2px; margin-right: 4px; vertical-align: -1px; }
  .dimlabel { font-size: 11px; background: rgba(31,35,40,.82); color: #fff; padding: 2px 6px; border-radius: 4px; white-space: nowrap; pointer-events: none; }
  #results { padding: 18px 22px 60px; }
  .cards { display: grid; grid-template-columns: repeat(auto-fit, minmax(150px, 1fr)); gap: 10px; }
  .card { background: var(--panel); border: 1px solid var(--line); border-radius: 10px; padding: 12px 14px; }

  .warns { list-style: none; padding: 0; margin: 16px 0 0; display: grid; gap: 6px; }

  .warns .info { background: var(--info-bg); color: var(--info); }
  h2 { font-size: 14px; margin: 26px 0 8px; display: flex; align-items: center; gap: 10px; }
  h2 .sub { font-weight: 400; color: var(--muted); font-size: 12px; }
  table { width: 100%; border-collapse: collapse; background: var(--panel); border: 1px solid var(--line); border-radius: 10px; overflow: hidden; font-variant-numeric: tabular-nums; }
  th, td { padding: 7px 10px; border-bottom: 1px solid var(--line); text-align: left; font-size: 13px; }
  th { background: #faf9f7; font-size: 11px; color: var(--muted); font-weight: 600; }

  .btn.primary { background: var(--ink); color: #fff; border-color: var(--ink); }
  .foot { color: var(--muted); font-size: 11px; margin-top: 22px; line-height: 1.7; }
  #toast { position: fixed; bottom: 20px; left: 50%; transform: translateX(-50%); background: var(--ink); color: #fff; padding: 8px 16px; border-radius: 999px; font-size: 12px; opacity: 0; transition: opacity .2s; pointer-events: none; }

  .pane { display: none; }
  .pane.on { display: block; }

  .tag.open { background: var(--info-bg); color: var(--info); }

  .mini.danger { color: var(--err); }
  .btn:disabled { opacity: .45; cursor: default; }
  .empty { color: var(--muted); font-size: 12.5px; }
  .lw { display: flex; align-items: center; gap: 4px; min-width: 0; }
  .f.wide { grid-template-columns: 1fr; }
  .f.wide select { text-align: left; }
  .q { display: inline-flex; align-items: center; justify-content: center; width: 16px; height: 16px; padding: 0; margin-left: 3px; border-radius: 50%; border: 1px solid #c9c4bb; background: #fff; color: var(--muted); font: 700 10px/1 system-ui, sans-serif; cursor: help; flex: none; vertical-align: 1px; }
  .q:hover, .q:focus-visible { background: var(--ink); color: #fff; border-color: var(--ink); outline: none; }
  .term { white-space: nowrap; }
  #tip { position: fixed; z-index: 50; max-width: 300px; background: #1f2328; color: #fff; padding: 10px 12px; border-radius: 10px; font-size: 12.5px; line-height: 1.65; box-shadow: 0 6px 24px rgba(0,0,0,.18); opacity: 0; pointer-events: none; transition: opacity .12s; }
  #tip.on { opacity: 1; pointer-events: auto; }
  #tip b { display: block; font-size: 13px; margin-bottom: 2px; }

  @media (max-width: 820px) {

  }
</style>

<header>
  <h1>単管パイプ屋根 設計ツール</h1>

<script type="module">
import * as THREE from 'three';
import { OrbitControls } from 'three/addons/controls/OrbitControls.js';
import { CSS2DRenderer, CSS2DObject } from 'three/addons/renderers/CSS2DRenderer.js';
import { compute, DEFAULTS, STD_PIPES, SHEETS, pipeKey, sheetKey } from './tankan-core.js';
import { drawSheet } from './drawing.js';
import { GLOSSARY } from './glossary.js';

// ---------- 入力項目 ----------
// term: 「？」で出す用語（glossary.js）。hint: その入力欄だけの補足（「？」の中に一緒に出す）
const isMono = (p) => p.roofType === 'mono';
const on = (k) => (p) => p[k] === true || p[k] === 'true';
const FACE_FIELDS = [['F', '前面'], ['B', '後面'], ['R', '左面'], ['L', '右面']].flatMap(([k, g]) => [
  { g, id: 'b' + k, label: '筋交いを入れる', type: 'check', term: '筋交い', hint: k === 'F' ? '出入りする面は、筋交いを入れないか、上の方だけに入れることが多いです。' : '' },
  { g, id: `b${k}lo`, label: '筋交いの下端', unit: 'm', step: 0.1, min: 0.05, max: 5, show: on('b' + k), term: '筋交い', hint: '筋交いが始まる高さです。柱の途中から出すときは、この数字を大きくします。' },
  { g, id: `b${k}hi`, label: '筋交いの上端', unit: 'm', step: 0.1, min: 0, max: 6, show: on('b' + k), term: '筋交い', hint: '筋交いが終わる高さです。0 のときは桁のすぐ下までになります。' },
  { g, id: 't' + k, label: '胴つなぎの高さ', unit: 'm', step: 0.1, min: 0, max: 5, term: '胴つなぎ', hint: '0 のときは入れません。0.2くらいにすると根がらみになります。' },
]);
const BASE_OPTIONS = [['slab', 'コンクリートの土間に固定'], ['pincoro', 'ピンコロ（束石）に載せる'], ['buried', '穴を掘ってコンクリートで固める'], ['driven', '地面に直接打ち込む']];
const FIELDS = [
  { g: '基本寸法', id: 'W', label: '間口（幅）', unit: 'm', step: 0.1, min: 1, max: 15, term: '間口' },
  { g: '基本寸法', id: 'D', label: '奥行き', unit: 'm', step: 0.1, min: 1, max: 10, term: '奥行き' },
  { g: '基本寸法', id: 'roofType', label: '屋根の形', type: 'select', options: [['mono', '片流れ'], ['gable', '切妻（三角）']], term: '屋根の形' },
  { g: '基本寸法', id: 'H1', label: (p) => (isMono(p) ? '前の高さ' : '軒の高さ'), unit: 'm', step: 0.1, min: 1.5, max: 5, term: (p) => (isMono(p) ? '前の高さ' : '軒') },
  { g: '基本寸法', id: 'H2', label: '後ろの高さ', unit: 'm', step: 0.1, min: 1.5, max: 5, show: isMono, term: '後ろの高さ' },
  { g: '基本寸法', id: 'Hr', label: '棟の高さ', unit: 'm', step: 0.1, min: 1.5, max: 6, show: (p) => !isMono(p), term: '棟' },
  { g: '基礎', id: 'base', label: '基礎の種類', type: 'select', wide: true, options: BASE_OPTIONS, term: '基礎の種類' },
  { g: '基礎', id: 'embed', label: '根入れの深さ', unit: 'm', step: 0.05, min: 0, max: 1.5, show: (p) => p.base === 'buried' || p.base === 'driven', term: '根入れ', hint: '50〜60cm以上が目安です。この分、柱が長くなります。' },
  { g: '基礎', id: 'holeD', label: '穴の直径', unit: 'm', step: 0.05, min: 0.1, max: 0.6, show: (p) => p.base === 'buried', term: '穴の直径' },
  { g: '柱と垂木', id: 'nx', label: '間口方向の柱の本数', unit: '本', step: 1, min: 2, max: 8, term: '柱', hint: '前の列と後ろの列、それぞれの本数です。' },
  { g: '柱と垂木', id: 'ny', label: '奥行き方向の柱の本数', unit: '本', step: 1, min: 2, max: 6, term: '柱', hint: '左右の列の本数です（角の柱も含みます）。' },
  { g: '柱と垂木', id: 'nr', label: '垂木の本数', unit: '本', step: 1, min: 2, max: 12, term: '垂木', hint: '柱の本数以上にします。垂木と垂木の間は1.8m以下が目安です。' },
  { g: '屋根', id: 'oe', label: '軒の出（前後）', unit: 'm', step: 0.05, min: 0, max: 1, term: '軒の出' },
  { g: '屋根', id: 'os', label: 'けらばの出（左右）', unit: 'm', step: 0.05, min: 0, max: 1, term: 'けらばの出' },
  { g: '屋根', id: 'ps', label: '母屋の間隔', unit: 'm', step: 0.05, min: 0.3, max: 1.5, term: '母屋', hint: '60〜90cmが目安です。' },
  { g: '屋根', id: 'roofing', label: '波板を張る', type: 'check', term: '波板' },
  { g: '補強', id: 'braceStyle', label: '筋交いの入れ方', type: 'select', options: [['single', '片筋交い'], ['x', 'たすき（X）']], term: (p) => (p.braceStyle === 'x' ? 'たすき' : '片筋交い') },
  { g: '補強', id: 'hiuchi', label: '火打ち（上の四隅）', type: 'check', term: '火打ち' },
  ...FACE_FIELDS,
  { g: '細かい設定', adv: true, id: 'margin', label: '単管の余長', unit: 'm', step: 0.05, min: 0, max: 0.5, term: '余長', hint: 'この分を足した長さ以上の定尺を選びます。' },
  { g: '細かい設定', adv: true, id: 'anchorsPerBase', label: 'ベース1個のアンカー本数', unit: '本', step: 1, min: 1, max: 4, show: (p) => p.base === 'slab' || p.base === 'pincoro', term: 'あと施工アンカー', hint: 'ピンコロのときは、割れないように2本までにしています。' },
  { g: '細かい設定', adv: true, id: 'sheetWork', label: '波板1枚の働き幅', unit: 'm', step: 0.01, min: 0.3, max: 1, term: '働き幅' },
  { g: '細かい設定', adv: true, id: 'hookPitch', label: '波板フックの間隔', unit: 'm', step: 0.05, min: 0.1, max: 0.6, term: '波板フック' },
  ...STD_PIPES.map((s) => ({ g: '単価（円・税込）', adv: true, id: pipeKey(s), label: `単管 ${s}m`, unit: '円', step: 10, min: 0 })),
  { g: '単価（円・税込）', adv: true, id: 'cFixed', label: '直交クランプ', unit: '円', step: 10, min: 0 },
  { g: '単価（円・税込）', adv: true, id: 'cSwivel', label: '自在クランプ', unit: '円', step: 10, min: 0 },
  { g: '単価（円・税込）', adv: true, id: 'cJoint', label: 'ジョイント', unit: '円', step: 10, min: 0 },
  { g: '単価（円・税込）', adv: true, id: 'cBase', label: '固定ベース', unit: '円', step: 10, min: 0 },
  { g: '単価（円・税込）', adv: true, id: 'cAnchor', label: 'アンカー', unit: '円', step: 10, min: 0 },
  { g: '単価（円・税込）', adv: true, id: 'cCap', label: 'キャップ', unit: '円', step: 10, min: 0 },
  { g: '単価（円・税込）', adv: true, id: 'cPincoro', label: 'ピンコロ（20cm角）', unit: '円', step: 10, min: 0 },
  { g: '単価（円・税込）', adv: true, id: 'cGravel', label: '砕石（20kg）', unit: '円', step: 10, min: 0 },
  { g: '単価（円・税込）', adv: true, id: 'cConcrete', label: 'ドライコンクリート（25kg）', unit: '円', step: 10, min: 0 },
  { g: '単価（円・税込）', adv: true, id: 'cDriveCap', label: '打ち込みキャップ', unit: '円', step: 10, min: 0 },
  ...SHEETS.map((s) => ({ g: '単価（円・税込）', adv: true, id: sheetKey(s.shaku), label: `波板 ${s.shaku}尺`, unit: '円', step: 10, min: 0 })),
  { g: '単価（円・税込）', adv: true, id: 'cHook', label: '波板フック', unit: '円', step: 1, min: 0 },
  { g: '単価（円・税込）', adv: true, id: 'cRidge', label: '棟包み（1mあたり）', unit: '円', step: 10, min: 0 },
];

// ---------- 「？」の説明 ----------
const escT = (s) => String(s).replace(/[&<>"]/g, (c) => ({ '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;' }[c]));
const qbtn = (term, hint = '') => (term && GLOSSARY[term]) || hint
  ? `<button type="button" class="q" data-term="${escT(term || '')}" data-hint="${escT(hint || '')}" aria-label="${escT(term || '説明')}の説明">?</button>` : '';
// 文中の [[用語]] を「用語？」に置きかえる（text はエスケープ済み）
const withTerms = (html) => html.replace(/\[\[(.+?)\]\]/g, (_, t) => `<span class="term">${t}${qbtn(t)}</span>`);
const tip = document.createElement('div'); tip.id = 'tip'; tip.setAttribute('role', 'tooltip'); document.body.appendChild(tip);
let tipPinned = null, tipFor = null;
function showTip(btn) {
  const term = btn.dataset.term, hint = btn.dataset.hint;
  const body = term && GLOSSARY[term] ? GLOSSARY[term] : '';
  tip.innerHTML = (term ? `<b>${escT(term)}</b>` : '') + (body ? `<p>${escT(body).replace(/\n/g, '<br>')}</p>` : '') + (hint ? `<p class="tiphint">${escT(hint)}</p>` : '');
  tip.classList.add('on'); tipFor = btn;
  const r = btn.getBoundingClientRect(), tw = tip.offsetWidth, th = tip.offsetHeight;
  let left = Math.min(Math.max(8, r.left + r.width / 2 - tw / 2), innerWidth - tw - 8);
  let top = r.bottom + 8; if (top + th > innerHeight - 8) top = Math.max(8, r.top - th - 8);
  tip.style.left = left + 'px'; tip.style.top = top + 'px';
}
function hideTip() { tip.classList.remove('on'); tipFor = null; tipPinned = null; }
document.addEventListener('mouseover', (e) => { const b = e.target.closest?.('.q'); if (b && !tipPinned) showTip(b); });
document.addEventListener('mouseout', (e) => { const b = e.target.closest?.('.q'); if (b && !tipPinned && tipFor === b) hideTip(); });
document.addEventListener('click', (e) => {
  const b = e.target.closest?.('.q');
  if (b) {
    e.preventDefault(); e.stopPropagation();
    if (tipPinned === b) hideTip(); else { showTip(b); tipPinned = b; }
    return;
  }
  if (!e.target.closest?.('#tip')) hideTip();
}, true);
addEventListener('scroll', () => hideTip(), true);

// 外から来たデータ（URL・保存・JSON）を、知っている項目だけ・正しい型にそろえる
function normalizeParams(obj) {
  const out = { ...DEFAULTS };
  if (!obj || typeof obj !== 'object') return out;
  for (const k in DEFAULTS) {
    if (!(k in obj)) continue;
    const v = obj[k], d = DEFAULTS[k];
    if (typeof d === 'number') { const n = Number(v); if (Number.isFinite(n)) out[k] = n; }
    else if (typeof d === 'boolean') out[k] = v === true || v === 'true' || v === 1;
    else if (typeof v === 'string') out[k] = v;
  }
  // 旧バージョン：胴つなぎ1つの高さ → 4面に展開
  if (Number(obj.tieH) > 0) for (const k of ['F', 'B', 'L', 'R']) if (!(Number(obj['t' + k]) > 0)) out['t' + k] = Number(obj.tieH);
  if (!['mono', 'gable'].includes(out.roofType)) out.roofType = 'mono';
  if (!['single', 'x'].includes(out.braceStyle)) out.braceStyle = 'single';
  if (!['slab', 'pincoro', 'buried', 'driven'].includes(out.base)) out.base = 'slab';
  return out;
}
let state = { ...DEFAULTS };
try {
  const h = location.hash.slice(1);
  if (h) state = normalizeParams(JSON.parse(decodeURIComponent(h)));
  else { const s = localStorage.getItem('tankan-designer'); if (s) state = normalizeParams(JSON.parse(s)); }
} catch (e) { /* 無視 */ }

function diffState() {
  const d = {};
  for (const k in state) if (String(state[k]) !== String(DEFAULTS[k])) d[k] = state[k];
  return d;
}

function build(r) {
  clearGroup(world); meshes = [];
  const { W, D, H1, H2, Hr, mono, oe, os, base, embed, holeD } = r.dims;
  // 基礎
  const concreteMat = new THREE.MeshStandardMaterial({ color: 0xd3cfc8, roughness: 0.95 });
  if (base === 'slab') {
    const slab = new THREE.Mesh(new THREE.BoxGeometry(W + 0.4, 0.1, D + 0.4), concreteMat);
    slab.position.set(W / 2, -0.05, D / 2); world.add(slab);
    grid.position.y = -0.101;
  } else if (base === 'pincoro') {
    grid.position.y = -0.121; // ピンコロの上が地面から約8cm出ている
  } else {
    // 地面を半透明にして、埋まっている部分を見えるようにする
    const ground = new THREE.Mesh(new THREE.BoxGeometry(W + 1.2, 0.02, D + 1.2), new THREE.MeshStandardMaterial({ color: 0xb59f7f, transparent: true, opacity: 0.35, depthWrite: false }));
    ground.position.set(W / 2, -0.01, D / 2); world.add(ground);
    grid.position.y = -0.021;
  }
  // 部材
  for (const m of r.members) {
    const off = YOFF[m.kind] || 0;
    const a = new THREE.Vector3(m.a[0], m.a[1] + off, m.a[2]);
    const b = new THREE.Vector3(m.b[0], m.b[1] + off, m.b[2]);
    const dir = b.clone().sub(a); const len = dir.length();
    const mesh = new THREE.Mesh(cyl, mats[m.kind]);
    mesh.scale.set(1, len, 1);
    mesh.quaternion.setFromUnitVectors(up, dir.normalize());
    mesh.position.copy(a).add(b).multiplyScalar(0.5);
    mesh.userData = { key: m.key, kind: m.kind };
    world.add(mesh); meshes.push(mesh);
    if (m.kind === 'post') {
      if (base === 'slab' || base === 'pincoro') {
        const plate = new THREE.Mesh(new THREE.BoxGeometry(0.15, 0.012, 0.15), new THREE.MeshStandardMaterial({ color: 0x3b3f45 }));
        plate.position.set(m.a[0], 0.006, m.a[2]); world.add(plate);
      }
      if (base === 'pincoro') {
        const blk = new THREE.Mesh(new THREE.BoxGeometry(0.2, 0.2, 0.2), concreteMat);
        blk.position.set(m.a[0], -0.1, m.a[2]); world.add(blk);
      }
      if (base === 'buried' && embed > 0) {
        const c = new THREE.Mesh(new THREE.CylinderGeometry(holeD / 2, holeD / 2, embed, 20), new THREE.MeshStandardMaterial({ color: 0xbdb8b0, transparent: true, opacity: 0.45, depthWrite: false }));
        c.position.set(m.a[0], -embed / 2, m.a[2]); world.add(c);

  if (r.roof) {
    const rm = new THREE.MeshStandardMaterial({ color: 0x9fd0f0, transparent: true, opacity: 0.32, side: THREE.DoubleSide, depthWrite: false });
    for (const s of r.slopes) {
      const pts = s.pts.map((p) => new THREE.Vector3(p[0], p[1] + 0.13, p[2]));
      const g = new THREE.BufferGeometry().setFromPoints([pts[0], pts[1], pts[2], pts[0], pts[2], pts[3]]);
      g.computeVertexNormals();
      roofGroup.add(new THREE.Mesh(g, rm));
      const edge = new THREE.LineLoop(new THREE.BufferGeometry().setFromPoints(pts), new THREE.LineBasicMaterial({ color: 0x5c8fb3 }));

  // 寸法
  dimGroup = new THREE.Group();
  const f = (v) => v.toFixed(2).replace(/\.?0+$/, '') + 'm';
  const zf = -0.45, xl = -0.45;
  dimGroup.add(dimLine([0, 0.02, zf], [W, 0.02, zf]), label('間口 ' + f(W), [W / 2, 0.02, zf]));
  dimGroup.add(dimLine([W + 0.45, 0.02, 0], [W + 0.45, 0.02, D]), label('奥行 ' + f(D), [W + 0.45, 0.02, D / 2]));
  dimGroup.add(dimLine([xl, 0, 0], [xl, H1, 0]), label((mono ? '前 ' : '軒 ') + f(H1), [xl, H1 / 2, 0]));
  if (mono) dimGroup.add(dimLine([xl, 0, D], [xl, H2, D]), label('後 ' + f(H2), [xl, H2 / 2, D]));
  else dimGroup.add(dimLine([xl, 0, D / 2], [xl, Hr, D / 2]), label('棟 ' + f(Hr), [xl, Hr / 2, D / 2]));
  dimGroup.visible = showDims; world.add(dimGroup);
  applySelection();
  const dimsKey = [W, D, Math.max(H1, H2, mono ? 0 : Hr)].map((v) => v.toFixed(1)).join();
  if (dimsKey !== lastDims) { setView(lastDims ? currentView : 'persp', r.dims); lastDims = dimsKey; }

function importJson(text, fileName) {
  let obj;
  try { obj = JSON.parse(text); } catch (e) { toast('JSONとして読めませんでした'); return; }
  const base = String(fileName || '読み込んだ設計').replace(/\.json$/i, '');
  let list;
  if (obj && Array.isArray(obj.designs)) list = obj.designs;
  else if (Array.isArray(obj)) list = obj;
  else if (obj && obj.params) list = [obj];
  else if (obj && typeof obj === 'object' && ('W' in obj || 'D' in obj)) list = [{ name: base, params: obj }];
  else { toast('このツールの設計データではないようです'); return; }
  const added = [];
  list.forEach((d, i) => {
    if (!d || typeof d !== 'object') return;
    const params = normalizeParams(d.params || d);
    const name = String(d.name || (list.length > 1 ? `${base} ${i + 1}` : base)).slice(0, 60);
    const dup = saves.find((s) => s.name === name && sameParams(s.params, params));
    if (dup) { added.push(dup); return; }
    const rec = { id: newId(), name, savedAt: d.savedAt || new Date().toISOString(), params };
    saves.push(rec); added.push(rec);
  });
  if (!added.length) { toast('読み込める設計がありませんでした'); return; }
  storeSaves();
  if (added.length === 1) { openSave(added[0]); toast(`「${added[0].name}」を読み込みました`); }

  const cmpRows = rowsData.map((x) => {
    const diff = x.s.total - r.total;
    const diffTxt = x.cur ? '—' : diff === 0 ? '±0' : (diff > 0 ? '+' : '−') + yen(Math.abs(diff)).slice(1);
    const isOpen = x.sv && x.sv.id === meta.saveId;
    const nameCell = x.cur
      ? `<b>いま編集中</b><div class="subname"><span>${esc(x.name)}</span>${dirty ? ' <span class="tag">変更あり</span>' : ''}</div>`
      : `${esc(x.name)}${isOpen ? ' <span class="tag open">編集中</span>' : ''}<div class="subname">${fmtDate(x.sv.savedAt)}</div>`;
    const ops = x.cur ? '' : `<button class="mini" data-op="open" data-id="${x.sv.id}">開く</button><button class="mini" data-op="over" data-id="${x.sv.id}">上書き</button><button class="mini" data-op="json" data-id="${x.sv.id}">JSON</button><button class="mini danger" data-op="del" data-id="${x.sv.id}">削除</button>`;
    return `<tr class="${x.cur ? 'currow' : ''}"><td>${nameCell}</td><td>${x.s.shape}</td><td>${x.s.size}</td><td>${x.s.cols}</td><td>${x.s.base}</td><td>${x.s.braces}</td><td class="n">${x.s.pipes}</td><td class="n">${x.s.clamps}</td><td class="n">${x.s.weight}</td>
      <td class="n${x.s.total === minTotal && rowsData.length > 1 ? ' best' : ''}">${yen(x.s.total)}</td><td class="n">${diffTxt}</td><td class="n">${x.s.warns ? `<span class="wcount">${x.s.warns}</span>` : '—'}</td><td class="ops">${ops}</td></tr>`;
  }).join('');

  const tabs = [['buy', '購入リスト'], ['parts', '部材リスト'], ['draw', '3面図'], ['saves', `保存・比較${saves.length ? `（${saves.length}）` : ''}`]];
  el.innerHTML = `
    <div class="cards">
      <div class="card total"><div class="k">概算の材料費</div><div class="v">${yen(r.total)}</div><div class="s">税込・ホームセンター価格の目安</div></div>
      <div class="card"><div class="k">単管パイプ</div><div class="v">${r.pipeCount}本</div><div class="s">合計 ${r.pipeLength.toFixed(1)} m</div></div>
      <div class="card"><div class="k">クランプ</div><div class="v">${r.clamps.fixed + r.clamps.swivel}個</div><div class="s">直交 ${r.clamps.fixed} ／ 自在 ${r.clamps.swivel}</div></div>
      <div class="card"><div class="k">単管の重さ</div><div class="v">約${Math.round(r.weight)}kg</div><div class="s">軽量単管（約2.1kg/m）の場合</div></div>
    </div>
    <ul class="warns">${warns.map((w) => `<li class="${w.level}">${withTerms(esc(w.text))}</li>`).join('')}</ul>
    <div class="tabs" role="tablist">${tabs.map(([k, t]) => `<button role="tab" data-tab="${k}" aria-selected="${k === activeTab}">${t}</button>`).join('')}</div>

    <div class="pane" data-pane="buy">
      <h2>購入リスト <span class="sub">ホームセンターに持っていく用</span></h2>
      <table><thead><tr><th>品名</th><th>規格</th><th class="n">数量</th><th class="n">単価</th><th class="n">小計</th></tr></thead>
      <tbody>${itemRows}</tbody>
      <tfoot><tr><td colspan="4">合計</td><td class="n">${yen(r.total)}</td></tr></tfoot></table>
      <div class="actions"><button class="btn" id="bCsv">購入リストをCSVで保存</button></div>
    </div>

    <div class="pane" data-pane="parts">
      <h2>部材リスト <span class="sub">行をクリックすると3Dで光ります</span></h2>
      <table><thead><tr><th>部材</th><th class="n">必要な長さ</th><th>使う単管</th><th class="n">本数</th></tr></thead>
      <tbody>${memberRows}</tbody></table>
    </div>

    <div class="pane" data-pane="draw">
      <h2>3面図 <span class="sub">上・前・右から見た図。寸法の単位はmm</span></h2>
      <div class="sheet">${sheetSvg(r)}</div>
      <div class="actions">
        <button class="btn primary" id="bSheetPrint">3面図を印刷（A3横）</button>
        <button class="btn" id="bSheetSvg">SVGで保存</button>
      </div>
      <p class="foot">・柱の位置や長さの確認用の簡単な図です。単管の太さやクランプのずれ（約5cm）は省いています。<br>・図の左右は、前に立って見たときの左右です。左面・右面の設定もこれに合わせています。</p>
    </div>

    <div class="pane" data-pane="saves">
      <h2>設計の保存と比較 <span class="sub">いくつか保存して、費用や本数を並べて比べられます</span></h2>
      <div class="saverow">
        <label for="dName">設計の名前</label>
        <input id="dName" type="text" maxlength="60" placeholder="${esc(nextName())}" value="${esc(meta.name)}">
        <button class="btn primary" id="bSaveNew">新しく保存</button>
        ${cur ? `<button class="btn" id="bSaveOver">「${esc(cur.name)}」に上書き</button>` : ''}
      </div>
      <div class="scrollx"><table class="cmp"><thead><tr><th>名前</th><th>形</th><th>間口×奥行×高さ</th><th>柱／垂木</th><th>基礎</th><th>筋交い</th><th class="n">単管</th><th class="n">クランプ</th><th class="n">重さ</th><th class="n">材料費</th><th class="n">いまとの差</th><th class="n">注意</th><th></th></tr></thead>
      <tbody>${cmpRows}</tbody></table></div>
      ${saves.length ? '' : '<p class="empty">まだ保存した設計はありません。名前を付けて「新しく保存」を押すと、ここに並びます。</p>'}
      <div class="actions">
        <button class="btn" id="bJsonCur">今の設計をJSONで書き出す</button>
        <button class="btn" id="bJsonAll" ${saves.length ? '' : 'disabled'}>保存した設計を全部JSONで書き出す</button>
        <button class="btn" id="bJsonLoad">JSONファイルを読み込む</button>
        <input type="file" id="fJson" accept=".json,application/json" hidden>
      </div>
      <p class="foot">・保存した設計は、このブラウザの中だけに残ります。別のパソコンやスマホに移すときや、ブラウザの履歴・データを消す前は、JSONで書き出しておいてください。<br>・「材料費」でいちばん安い設計は緑色になります。「注意」は、黄色や赤の注意が出ている数です。</p>
    </div>

    <div class="actions">
      <button class="btn" id="bShare">この設計のURLをコピー</button>
      <button class="btn" id="bPrint">このページを印刷</button>
    </div>
    <p class="foot">
      ・単価は2026年時点のホームセンター価格をもとにした目安です。「細かい設定・単価を変える」で実際の値段に直せます。<br>
      ・クランプの数は、部材が交わる点を1か所1個で数えています。現場で継ぎ足しや補強を足す分、数個多めに買っておくと安心です。<br>
      ・強度計算はしていません。積雪・強風地域では柱・垂木・筋交いを増やし、不安なら専門家に相談してください。
    </p>`;

  const showTab = (k) => {
    activeTab = k;
    el.querySelectorAll('[data-tab]').forEach((b) => b.setAttribute('aria-selected', b.dataset.tab === k));
    el.querySelectorAll('[data-pane]').forEach((p) => p.classList.toggle('on', p.dataset.pane === k));
  };
  el.querySelectorAll('[data-tab]').forEach((b) => (b.onclick = () => showTab(b.dataset.tab)));
  showTab(activeTab);

  el.querySelectorAll('tr[data-key]').forEach((tr) => (tr.onclick = () => {
    selectedKey = selectedKey === tr.dataset.key ? null : tr.dataset.key; applySelection();
  }));
  applySelection();
  const $ = (id) => document.getElementById(id);
  $('bShare').onclick = async () => {
    const url = location.href.split('#')[0] + '#' + encodeURIComponent(JSON.stringify(diffState()));
    try { await navigator.clipboard.writeText(url); toast('URLをコピーしました'); } catch { prompt('このURLをコピーしてください', url); }
  };
  $('bCsv').onclick = () => {
    const rows = [['区分', '品名', '規格', '数量', '単価', '小計'], ...r.items.map((i) => [i.group, i.name, i.spec, i.qty, i.unit, i.subtotal]), ['', '合計', '', '', '', r.total]];
    download(`${safeFile(meta.name || '単管')}_購入リスト.csv`, '﻿' + rows.map((row) => row.map((v) => `"${String(v).replace(/"/g, '""')}"`).join(',')).join('\r\n'), 'text/csv');
  };
  $('bPrint').onclick = () => print();
  $('bSheetSvg').onclick = () => download(`${safeFile(meta.name || '単管')}_3面図.svg`, sheetSvg(r), 'image/svg+xml');
  $('bSheetPrint').onclick = () => printSheet(r);

  // 保存・比較
  $('dName').oninput = (e) => {
    meta.name = e.target.value.trim(); storeMeta();
    const sub = el.querySelector('tr.currow .subname'); if (sub) sub.firstChild.textContent = meta.name || '（名前なし）';
  };
  $('bSaveNew').onclick = () => {
    const name = meta.name || nextName();
    const rec = { id: newId(), name, savedAt: new Date().toISOString(), params: { ...state } };
    saves.push(rec); meta = { name, saveId: rec.id }; storeMeta();
    if (storeSaves()) toast(`「${name}」を保存しました`);
    renderResults(last);
  };
  if ($('bSaveOver')) $('bSaveOver').onclick = () => {
    cur.params = { ...state }; cur.savedAt = new Date().toISOString(); if (meta.name) cur.name = meta.name;
    if (storeSaves()) toast(`「${cur.name}」に上書きしました`);
    renderResults(last);
  };
  el.querySelectorAll('button[data-op]').forEach((b) => (b.onclick = () => {
    const rec = saves.find((s) => s.id === b.dataset.id); if (!rec) return;
    const op = b.dataset.op;
    if (op === 'open') { openSave(rec); toast(`「${rec.name}」を開きました`); }
    else if (op === 'over') {
      if (!confirm(`「${rec.name}」を、いま編集中の設計で上書きしますか？`)) return;
      rec.params = { ...state }; rec.savedAt = new Date().toISOString(); meta.saveId = rec.id; meta.name = rec.name; storeMeta();
      if (storeSaves()) toast(`「${rec.name}」に上書きしました`); renderResults(last);
    } else if (op === 'json') download(`${safeFile(rec.name)}.json`, exportJson([rec]), 'application/json');
    else if (op === 'del') {
      if (!confirm(`「${rec.name}」を削除しますか？（元に戻せません）`)) return;
      saves = saves.filter((s) => s !== rec); if (meta.saveId === rec.id) { meta.saveId = null; storeMeta(); }
      storeSaves(); renderResults(last); toast('削除しました');
    }
  }));
  $('bJsonCur').onclick = () => {
    const name = meta.name || nextName();
    download(`${safeFile(name)}.json`, exportJson([{ name, savedAt: new Date().toISOString(), params: { ...state } }]), 'application/json');
  };
  $('bJsonAll').onclick = () => download(`単管設計_${saves.length}件.json`, exportJson(saves), 'application/json');
  $('bJsonLoad').onclick = () => $('fJson').click();
  $('fJson').onchange = async (e) => {
    const file = e.target.files[0]; if (!file) return;
    importJson(await file.text(), file.name); e.target.value = '';
  };
}

function toast(t) { const el = document.getElementById('toast'); el.textContent = t; el.style.opacity = 1; setTimeout(() => (el.style.opacity = 0), 1600); }

function update(resetView) {
  refreshFormVisibility();
  if (resetView) lastDims = null;
  const r = compute(state); last = r;
  build(r); renderResults(r);
  const d = diffState();
  try { localStorage.setItem('tankan-designer', JSON.stringify(state)); } catch (e) { /* 無視 */ }
  history.replaceState(null, '', Object.keys(d).length ? '#' + encodeURIComponent(JSON.stringify(d)) : location.pathname + location.search);
}

buildForm();
resize();
update();
</script>
</body>
</html>
